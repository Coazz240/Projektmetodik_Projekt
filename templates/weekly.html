<!DOCTYPE html>

<html lang="sv">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">

			<style>
			</style>
	</head>
	<style>
	body {
	font-size: 20px;
	padding: 8px;
	}
	
	input {
	width: 100px;
	height: 20px;
	}
	
	button {
	width: 100px;
	}
	</style>
	<body>
	<h1>Skapa Veckorapport</h1>
	
{% if message %}
		<p style="color: green;">{{ message }}</p>
	{% endif %}
	{% if error %}
		<p style="color: red;">{{ error }}</p>
	{% endif %}
	
	<h2>Välj användare</h2>
	<form name="form1" id="form1" method="get" action="/ui/users">
		<label for="subject">Skapa rapport för:</label>
		<select name="subject" id="subject" required>
			<option value="" selected>Välj Användare</option>
			{% for user in users %}
				<option value="{{ user.id }}">{{ user.name }}</option>
			{% endfor %}
		</select>
		<!-- <button type="submit">Skapa rapport</button> -->
	</form>
	<form>
	<label for="week_start">Ange veckostart</label>
	<input type="date" id="week_start" name="week_start" required>
	<span>(YYYY-MM-DD, måndag)</span>
	</form>
	<form>
	<button type="submit">Skapa rapport</button>
	</form>
	
	</body>
</html>
